<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Projects | Patra Purbaya</title>
    
    <!-- External Libraries -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
    
    <!-- Modular CSS Files -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/navigation.css">
    <link rel="stylesheet" href="css/buttons.css">
    <link rel="stylesheet" href="css/portfolio.css">
    <link rel="stylesheet" href="css/effects.css">
    <link rel="stylesheet" href="css/modal.css">
    <link rel="stylesheet" href="css/footer.css">
</head>

<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">Patra Purbaya</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html#home">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="projects.html">Portfolio</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#about">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#contact">Contact</a></li>
                </ul>
                <div class="language-selector dropdown ms-3">
                    <button class="btn btn-outline-light dropdown-toggle" type="button" id="languageDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="fas fa-globe"></i> <span data-i18n="languageSelector.label">Language</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="languageDropdown" id="languageOptions">
                        <!-- Language options will be loaded dynamically -->
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <!-- Projects Section -->
    <section class="section-padding" style="padding-top: 150px;">
        <div class="container">
            <div class="row text-center mb-5">
                <div class="col-12" data-aos="fade-up">
                    <h1 class="fw-bold mb-3 text-gradient">All Projects</h1>
                    <p class="lead">Explore my complete portfolio across different platforms</p>
                </div>
            </div>

            <div class="row mb-5">
                <div class="col-12 mb-4" data-aos="fade-up">
                    <div class="platform-filter" id="portfolio-filters">
                        <!-- Portfolio filters will be loaded dynamically -->
                    </div>
                </div>
            </div>

            <div class="row portfolio-container" id="portfolio-items">
                <!-- Portfolio items will be loaded dynamically -->
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="py-4">
        <div class="container">
            <div class="row">
                <div class="col-12 text-center">
                    <p class="mb-2">
                        <a href="index.html" class="text-decoration-none" style="color: var(--primary-color);">← Back to Home</a>
                    </p>
                    <p class="mb-0">&copy;2025 Patra Purbaya. <span data-i18n="footer.copyright">All rights reserved.</span></p>
                </div>
            </div>
        </div>
    </footer>

    <!-- External Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    
    <!-- Compatibility Info -->
    <script src="js/compatibility.js"></script>
    
    <!-- Modular JavaScript - ES6 Modules -->
    <script type="module" src="js/main.js"></script>
